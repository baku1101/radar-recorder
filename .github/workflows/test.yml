name: Synthetic tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -B test/reader-config.py
      - run: npm test
      - name: Clean portable Windows setup (no sensor)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./test/windows-setup.ps1

      - name: Loopback proxy policy and 407 regression
        if: runner.os == 'Windows'
        run: node test/setup-network.mjs
